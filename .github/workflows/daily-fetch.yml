name: 汇率数据每日抓取

on:
  schedule:
    # 每天多轮抓取，确保北京时间上午即有当日数据。
    # 原理：GitHub Actions 调度常延迟 4-6h（实测 09:30 设定实际 14:00+ 才跑）。
    # 故把触发点设在 UTC 22:30/23:30/01:30（= 北京时间次日 06:30/07:30/09:30），
    # 借延迟让实际运行多落在 北京时间 10:30-13:00（此时 BOC 当日中间价已发布于~09:15），实现上午更新。
    # 脚本幂等：已含当日数据则跳过，重复运行无害。
    - cron: '30 22,23,1 * * *'
  workflow_dispatch:  # 支持手动触发

# 需要写权限才能推送代码
permissions:
  contents: write

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 获取完整Git历史
        ref: main       # 检出 main 分支（非 detached HEAD）
    
    - name: 设置Python环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install akshare pandas
    
    - name: 配置 Git
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
    
    - name: 生成配置文件
      env:
        EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
        EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
        EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
        WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
        WECHAT_ENABLED: ${{ secrets.WECHAT_ENABLED }}
      run: |
        chmod +x setup-config.sh
        ./setup-config.sh
    
    - name: 运行汇率抓取脚本
      run: |
        python fetch_rates.py
