name: 汇率数据每日抓取

on:
  schedule:
    # 全天多波 + 下午兜底：不再依赖 GitHub 调度延迟，确保当天数据最晚傍晚前必出。
    # 央行中间价约 09:15(北京)发布；首波放 09:30(北京)，后续 11/13/15/17/19 点多波兜底，
    # 任一波在 BOC 发布后运行即可抓到当日数据；GitHub 调度延迟不再决定成败。
    # 对应 UTC：01:30 / 03:00 / 05:00 / 07:00 / 09:00 / 11:00。
    - cron: '30 1 * * *'            # 北京 09:30
    - cron: '0 3,5,7,9,11 * * *'   # 北京 11:00 / 13:00 / 15:00 / 17:00 / 19:00
  workflow_dispatch:  # 支持手动触发

# 需要写权限才能推送代码
permissions:
  contents: write

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 获取完整Git历史
        ref: main       # 检出 main 分支（非 detached HEAD）
    
    - name: 设置Python环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install akshare pandas
    
    - name: 配置 Git
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
    
    - name: 生成配置文件
      env:
        EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
        EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
        EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
        WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
        WECHAT_ENABLED: ${{ secrets.WECHAT_ENABLED }}
      run: |
        chmod +x setup-config.sh
        ./setup-config.sh
    
    - name: 运行汇率抓取脚本
      run: |
        python fetch_rates.py
